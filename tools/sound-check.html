<!doctype html>
<meta charset="utf-8" />
<title>Sound check</title>
<!--
  The game's sound (src/sound.js) rendered offline, scene by scene, and measured: loudness
  (BS.1770, ungated), loudness through a phone's small speaker (nothing under 250 Hz), how
  far a one-shot stands out over the bed, the brightness (spectral centroid) of a sound on
  its own, and what a scene measures of its own (a band's loudness, its swell and period,
  onsets in it, left against right: see toolbox()). There are beds (each part of the river,
  rain, ice, a flood), crossings of the surface, one-shots over the bed, sounds on their
  own, scenes that must stay silent (muted, hushed, hidden, with every sound fired), scenes
  that go on for a while (a hunter lying in wait for a minute, strength low for half a
  minute, a kingfisher's attack as the game lists it) and half a minute of everything at
  once (the stress: voices, nodes, peaks). A scene can watch the sound's own stats frame by
  frame (`watch`) and count the nodes its events made (eventNodes). Run by
  tools/sound-check.mjs; open it by hand and call runAll() to look at it.
  (The scenes also run against an older src/sound.js, for a before and after: what it did
  not have yet is called with ?. and it is told `above` as well as `submerged`.)
-->
<script type="module">
  import { createSound } from "../src/sound.js";

  const SR = 48000;
  let seconds = 8;
  let current = null;
  const NODES = ["createOscillator", "createGain", "createBiquadFilter", "createBufferSource", "createStereoPanner", "createDynamicsCompressor", "createIIRFilter", "createConstantSource", "createWaveShaper", "createDelay", "createConvolver"];
  // An offline context the sound takes for the real thing: always "running", counting the
  // nodes made on it, and keeping its looping sources (so a scene can silence the beds).
  class Offline extends OfflineAudioContext {
    constructor() {
      super(2, SR * seconds, SR);
      this.count = 0;
      this.sources = [];
      current = this;
      for (const name of NODES) {
        const make = OfflineAudioContext.prototype[name] ?? BaseAudioContext.prototype[name];
        if (!make) continue;
        this[name] = (...args) => {
          this.count++;
          const node = make.apply(this, args);
          if (name === "createBufferSource") this.sources.push(node);
          return node;
        };
      }
    }
    get state() {
      return "running";
    }
    // (The sound lets the device go when silent; offline there is none.)
    suspend(at) {
      return at === undefined ? Promise.resolve() : super.suspend(at);
    }
  }
  window.AudioContext = Offline;

  const bed = { rain: 0, daylight: 1, stir: 0, roar: 0, sea: 0, submerged: 1, depth: 1 };
  const shot = (name, fire, params = {}) => ({ name, kind: "shot", params, events: [[4, fire]] });
  // On its own (the beds stopped), four times over: its sound is different every time.
  const solo = (name, fire, params = {}) => ({ name, kind: "solo", params, events: [1, 2.5, 4, 5.5].map((t) => [t, fire]) });
  const air = (t) => (t >= 4 && t < 6 ? 0 : 1);
  // One-hot region weights (the sound reads `regions` when it has them).
  const REGIONS = ["brook", "upper", "middle", "lower", "estuary", "sea"];
  const only = (name) => Object.fromEntries(REGIONS.map((r) => [r, r === name ? 1 : 0]));
  // Hunters as the game's warnings list has them (main.js warnings()): each its own key.
  const hunter = (kind, i = 0) => ({ kind, key: { kind, i }, level: 0, coiled: false, pan: 0, near: 0.5 });
  // Every sound there is, at once (for the silent scenes: none of it may be heard).
  function everything(s) {
    s.leap(1.2);
    s.splash(1.2, 3);
    s.dive?.(1.2);
    s.call("kingfisher");
    for (const kind of ["heron", "merganser", "seal", "bear"]) s.call(kind);
    s.chime("gold");
    s.fanfare();
    for (const kind of ["body", "rock", "wood", "net", "hook", "ice"]) s.thump(kind);
    s.thunder(1);
    s.otter();
    s.reel();
    s.snap();
    s.nip();
    s.swallow(0.8);
    s.eaten("fish");
    s.eaten("bird");
    s.dash?.(1);
    s.jaws?.(1, 1);
    s.denied?.();
    s.charge?.(0.9);
    s.leapResult?.("cleared");
    s.leapResult?.("failed");
    const list = [hunter("pike"), hunter("seal", 1), hunter("heron", 2), hunter("bear", 3)];
    list.forEach((h, i) => Object.assign(h, { level: 0.4 + 0.2 * i, coiled: i === 3, pan: i / 2 - 0.75 }));
    s.warn?.(list);
    s.whiff?.(list[0].key, "pike");
    s.whiff?.(list[2].key, "heron");
    s.storm?.();
    s.lightning?.(1);
    s.plops?.(5);
    s.counter?.();
    s.growth?.();
    s.victory?.();
    s.spawn?.();
    s.hatch?.();
    s.ending?.();
    s.debug?.ship?.();
    s.debug?.grunt?.();
    s.debug?.chirp?.();
  }
  // Everything the world can be at once, for the silent scenes and the stress.
  const busy = { rain: 1, roar: 1, flood: 1, danger: 1, energy: 0.1, breath: 0, winded: true, home: 1, mill: 1, flow: 6, depthRel: 0.9, regions: only("brook") };
  // The stress: half a minute of everything the game can throw at the sound at once.
  function stress() {
    const events = [];
    const hunters = [hunter("pike"), hunter("seal", 1), hunter("heron", 2), hunter("bear", 3)];
    for (let t = 0.5; t < 29.5; t += 0.3) events.push([t, (s) => s.splash(1 + (t % 1), 1 + ((t * 7) % 5))]);
    for (let t = 0.7; t < 29.5; t += 0.9) events.push([t, (s) => (s.dash ? s.dash(2) : s.nip())]);
    for (let t = 0.6; t < 29.5; t += 0.2) events.push([t, (s) => s.denied?.()]);
    for (let t = 0.4; t < 29.5; t += 1 / 30)
      events.push([
        t,
        (s) => {
          // Four hunters, each noticing, hunting, coiling and striking in turn, 3 s a round.
          hunters.forEach((h, i) => {
            const u = ((t + i * 0.7) % 3) / 3;
            h.level = u < 0.3 ? 0.4 : u < 0.6 ? 0.6 : u < 0.85 ? 0.8 : 1;
            h.coiled = u >= 0.85 && u < 0.95;
            h.pan = Math.sin(t * 0.7 + i);
            h.near = 0.5 + 0.5 * Math.sin(t + i);
          });
          s.warn?.(hunters.slice().sort((a, b) => b.level - a.level));
        },
      ]);
    for (let t = 1; t < 29.5; t += 2.3) events.push([t, (s) => s.call(["kingfisher", "heron", "merganser", "seal", "bear"][Math.floor(t) % 5])]);
    for (let t = 2; t < 29.5; t += 1.7) events.push([t, (s) => s.thump(["body", "rock", "wood", "net", "hook", "ice"][Math.floor(t) % 6])]);
    for (let t = 3; t < 29.5; t += 4.1) events.push([t, (s) => (s.chime("gold"), s.fanfare(), s.victory?.(), s.growth?.())]);
    for (let t = 1.5; t < 29.5; t += 3.3) events.push([t, (s) => (s.thunder(Math.random()), s.lightning?.(0.9), s.otter(), s.reel(), s.eaten(t % 2 < 1 ? "fish" : "bird"))]);
    for (let t = 5; t < 29.5; t += 5) events.push([t, (s) => (s.storm?.(), s.plops?.(5), s.counter?.(), s.leapResult?.("cleared"), s.leapResult?.("failed"), s.debug?.ship?.(), s.debug?.grunt?.(), s.debug?.chirp?.())]);
    for (let t = 2.2; t < 29.5; t += 1.5) events.push([t, (s) => s.whiff?.(hunters[Math.floor(t) % 4].key, hunters[Math.floor(t) % 4].kind)]);
    for (let t = 0.3; t < 29.5; t += 1 / 30) events.push([t, (s) => s.charge?.(0.5 - 0.5 * Math.cos((t / 1.2) * Math.PI * 2))]);
    events.push([29.4, (s) => s.charge?.(-1)]);
    return events;
  }
  // The warnings as the game gives them, every frame: `state(t)` sets the hunters and
  // returns the list (strongest first).
  function warnings(from, to, state) {
    const events = [];
    for (let t = from; t < to; t += 1 / 30) events.push([t, (s) => s.warn?.(state(t))]);
    return events;
  }
  function notice(name, pan) {
    const h = hunter("pike");
    return {
      name,
      kind: "shot",
      params: {},
      events: warnings(0.5, 7.8, (t) => (t < 4 ? [] : [Object.assign(h, { level: 0.4, pan, near: 0.6 })])),
      measure: (m) => ({ pan: m.pan(4.15, 4.5, 300, 550) }),
    };
  }
  // A hunter chasing from 1 s, coiling for `coil` seconds from 4 s: its last tick should
  // come where the coil ends.
  function coiling(name, coil) {
    const h = hunter("pike");
    // (The frame at 4 s may come a hair before it: 1e-6.)
    const from = 4 - 1e-6;
    return { name, kind: "shot", params: {}, events: warnings(0.5, 7.9, (t) => (t < 1 ? [] : [Object.assign(h, { level: t < from ? 0.8 : 1, coiled: t >= from && t < 4 + coil, coil: 4 + coil - t, near: 0.8 })])), measure: (m) => ({ coil, last: m.lastLoud(4, 4.2 + coil, 1000, 4500) - 4 }) };
  }
  const SCENES = [
    { name: "bed_river", kind: "bed", params: {}, measure: (m) => ({ gills: m.band(3, 8, 500, 1500) }) },
    { name: "bed_river_night", kind: "bed", params: { daylight: 0 } },
    { name: "bed_river_stir", kind: "bed", params: { stir: 1 } },
    { name: "bed_roar_near", kind: "bed", params: { roar: 1 } },
    { name: "bed_rain", kind: "bed", params: { rain: 1 } },
    { name: "bed_sea_deep", kind: "bed", params: { sea: 1, depth: 40 } },
    { name: "bed_above", kind: "bed", params: { submerged: 0 } },
    // Each part of the river on its own, at its current (probe-v2 means), a little below the
    // middle of the water.
    ...[
      ["brook", 1.6],
      ["upper", 2],
      ["middle", 2.6],
      ["lower", 4.9],
      ["estuary", 1],
      ["sea", 0.2],
    ].map(([region, flow]) => ({ name: `bed_${region}`, kind: "bed", params: { regions: only(region), sea: region === "sea" ? 1 : 0, flow, depthRel: 0.6 }, measure: (m) => ({ surge: m.modulation(3, 8, 40, 150) }) })),
    // Rain from under the surface, just below it; under ice (none gets through); a flood.
    { name: "bed_rain_under", kind: "bed", seconds: 12, params: { rain: 1, depthRel: 0.2 }, measure: (m) => ({ repeats: m.repeats(3, 12, 6000, 14000, 1.5, 3) }) },
    { name: "bed_ice", kind: "bed", params: { rain: 1, ice: 1 } },
    { name: "bed_flood", kind: "bed", params: { flood: 1, flow: 5 }, measure: (m) => ({ clatter: m.modulation(3, 8, 2000, 6000, 0.1) }) },
    { name: "bed_sea_swell", kind: "bed", seconds: 40, params: { regions: only("sea"), sea: 1, flow: 0.2, depthRel: 0.6 }, measure: (m) => ({ swell: m.modulation(3, 40, 150, 500), period: m.period(3, 40, 150, 500, 6, 14), swing: m.swing(3, 40, 0.4) }) },
    { name: "bed_above_roar", kind: "bed", params: { submerged: 0, roar: 1 } },
    { name: "bed_above_rain", kind: "bed", params: { submerged: 0, rain: 1 } },
    { name: "cross_river", kind: "cross", params: (t) => ({ submerged: air(t) }) },
    { name: "cross_roar", kind: "cross", params: (t) => ({ submerged: air(t), roar: 1 }) },
    { name: "cross_rain", kind: "cross", params: (t) => ({ submerged: air(t), rain: 1 }) },
    { name: "cross_sea", kind: "cross", params: (t) => ({ submerged: air(t), sea: 1, depth: 3 }) },
    {
      name: "leap_whole",
      kind: "cross",
      params: (t) => ({ submerged: t >= 4.1 && t < 5.1 ? 0 : 1 }),
      events: [
        [4, (s) => s.leap(1.2)],
        [5.05, (s) => (s.splash(0.9, 1.2), s.dive?.(1.2))],
      ],
    },
    {
      name: "muted_then_leap",
      kind: "silent",
      params: (t) => ({ ...busy, submerged: t >= 4.1 && t < 5.1 ? 0 : 1 }),
      events: [
        [1, (s) => s.toggle()],
        [4, (s) => s.leap(1.2)],
        [5.05, (s) => (s.splash(0.9, 1.2), s.dive?.(1.2), s.call(), everything(s))],
      ],
    },
    { name: "hushed_then_chime", kind: "silent", params: busy, events: [[1, (s) => s.hush(true)], [4, (s) => (s.chime("gold"), s.fanfare(), s.thump(), s.splash(1.2, 3), everything(s))]] },
    { name: "hidden_then_thunder", kind: "silent", params: { ...busy, ice: 1, regions: only("sea"), daylight: 0 }, events: [[1, (s) => s.hush(true, "hidden")], [4, (s) => (s.thunder(1), s.otter(), s.reel(), everything(s))]] },
    { name: "stress_30s", kind: "stress", seconds: 30, params: (t) => ({ ...busy, roar: (t / 5) % 2 < 1 ? 1 : 0.3, ice: (t / 7) % 2 < 1 ? 0 : 1, regions: only(REGIONS[Math.floor(t / 5) % 6]), submerged: t % 6 > 5.4 ? 0 : 1 }), events: stress() },
    shot("thump_body", (s) => s.thump("body")),
    shot("thump_rock", (s) => s.thump("rock")),
    shot("thump_wood", (s) => s.thump("wood")),
    shot("thump_net", (s) => s.thump("net")),
    shot("thump_hook", (s) => s.thump("hook")),
    shot("floe_knock", (s) => s.thump("ice", 1)),
    shot("ice_chirp", (s) => s.debug?.chirp?.(), { ice: 1 }),
    shot("nip", (s) => s.nip()),
    shot("swallow_small", (s) => s.swallow(0.1)),
    shot("swallow_big", (s) => s.swallow(0.9)),
    shot("splash_1", (s) => s.splash(1, 1)),
    shot("splash_fish_L3", (s) => s.splash(1, 3)),
    shot("leap", (s) => s.leap(1)),
    shot("dive", (s) => s.dive?.(1)),
    shot("rise_5", (s) => s.rise(5)),
    shot("call", (s) => s.call()),
    shot("otter", (s) => s.otter()),
    shot("reel", (s) => s.reel()),
    shot("snap", (s) => s.snap()),
    shot("thunder_near", (s) => s.thunder(1)),
    shot("lightning_near", (s) => s.lightning?.(1)),
    shot("lightning_above", (s) => s.lightning?.(1), { submerged: 0 }),
    // Above the water, heard from under it: the mill wheel near by from 4 s on, bread, the
    // fish counter.
    { name: "mill", kind: "shot", seconds: 12, params: (t) => ({ mill: t >= 4 ? 1 : 0 }), measure: (m) => ({ slaps: m.onsets(4, 12, 800, 2000, 4, 0.5) }) },
    shot("bread", (s) => s.plops?.(5)),
    // At sea: a ship passing (16 s from 4 s on), fish grunting at night.
    { name: "ship", kind: "shot", seconds: 24, params: { regions: only("sea"), sea: 1 }, events: [[4, (s) => s.debug?.ship?.(16)]], measure: (m) => ({ rise: m.band(10, 14, 30, 60) - m.band(2, 4, 30, 60), throb: m.period(9, 15, 300, 900, 0.2, 0.4, 0.02), after: m.band(21, 23.5, 30, 60) - m.band(2, 4, 30, 60) }) },
    // (And the same without them: the sea heaves, so they are heard against the same moment
    // of it.)
    { ...shot("grunts", (s) => s.debug?.grunt?.(), { regions: only("sea"), sea: 1, daylight: 0 }), measure: (m) => ({ knocks: m.onsets(4, 5, 150, 300, 4, 0.03), peak: m.loudest(4, 5, 0.4) }) },
    { ...shot("grunts_ref", () => {}, { regions: only("sea"), sea: 1, daylight: 0 }), measure: (m) => ({ peak: m.loudest(4, 5, 0.4) }) },
    shot("counter", (s) => s.counter?.()),
    { ...shot("storm_swell", (s) => s.storm?.()), seconds: 12, measure: (m) => ({ d400: m.loudest(4, 11.5, 0.4) - m.loudest(2.5, 4, 0.4), phone: m.loudestPhone(4, 11.5, 0.4) - m.loudestPhone(2.5, 4, 0.4) }) },
    // The same with the beds stopped: brightening as it swells (before its thunder at 8 s).
    { ...shot("storm_alone", (s) => s.storm?.()), alone: true, measure: (m) => ({ early: m.spectrum(5, 6.5).centroid, late: m.spectrum(6.5, 8).centroid }) },
    shot("thunder_far", (s) => s.thunder(0.1)),
    shot("eaten_fish", (s) => s.eaten("fish")),
    shot("eaten_bird", (s) => s.eaten("bird")),
    shot("fanfare", (s) => s.fanfare()),
    // What the fish does: a burst, its jaws, Space with no breath left, the leap's charge.
    shot("dash", (s) => s.dash?.(1)),
    shot("dash_L9", (s) => s.dash?.(9)),
    shot("jaws", (s) => s.jaws?.(1, 1)),
    shot("jaws_auto", (s) => s.jaws?.(1, 0.5)),
    shot("denied", (s) => s.denied?.()),
    shot("fall_cleared", (s) => s.leapResult?.("cleared")),
    shot("fall_failed", (s) => s.leapResult?.("failed")),
    {
      name: "charge",
      kind: "shot",
      params: {},
      // One swing of the meter (1.2 s), let go at its top the second time round.
      events: [...Array.from({ length: 54 }, (_, i) => [4 + i / 30, (s) => s.charge?.(0.5 - 0.5 * Math.cos(((i / 30) / 1.2) * Math.PI * 2))]), [5.8, (s) => s.charge?.(1, true)]],
      measure: (m) => ({ low: m.band(4.05, 4.2, 240, 420) - m.band(2.5, 4, 240, 420), high: m.band(4.5, 4.7, 700, 1000) - m.band(2.5, 4, 700, 1000), ticks: m.onsets(4, 6.2, 2800, 3800, 6) }),
    },
    // Hunters: noticed on the left and on the right, hunting, about to strike, missing.
    notice("warn_notice_left", -0.8),
    notice("warn_notice_right", 0.8),
    (() => {
      const h = hunter("trout");
      return { name: "warn_hunt", kind: "shot", params: {}, events: warnings(0.5, 7.9, (t) => (t < 4 ? [] : [Object.assign(h, { level: 0.8, near: 0.5 })])), measure: (m) => ({ pulses: m.onsets(4.7, 8, 200, 500, 5, 0.25) }) };
    })(),
    (() => {
      const h = hunter("pike");
      return { name: "warn_coiled", kind: "shot", params: {}, events: warnings(0.5, 7.9, (t) => (t < 4 ? [] : [Object.assign(h, { level: 1, coiled: t < 4.5, near: 0.8 })])), measure: (m) => ({ tick: m.band(4, 4.4, 1100, 2600) - m.band(2.5, 4, 1100, 2600) }) };
    })(),
    (() => {
      // Hunting from 1 s, striking at 2.5, gone off to recover at 4: it missed.
      const h = hunter("pike");
      return { name: "hunter_miss", kind: "shot", params: {}, events: [[4, (s) => s.whiff?.(h.key, "pike")], ...warnings(0.5, 7.9, (t) => (t < 1 || t >= 4 ? [] : [Object.assign(h, { level: t < 2.5 ? 0.8 : 1, coiled: t >= 2.5 && t < 2.8 })]))], measure: (m) => ({ snap: m.band(4, 4.15, 2000, 3000) - m.band(3.2, 3.9, 2000, 3000) }) };
    })(),
    // A kingfisher's attack as life.js lists it: hovering from 4 s, coiled from 4.8, gone
    // into its dive at 5.3, the catch at 5.65 -- nothing may snap before the catch.
    (() => {
      const k = hunter("kingfisher");
      return {
        name: "kingfisher_kill",
        kind: "shot",
        params: {},
        events: [[4, (s) => s.call("kingfisher")], [5.65, (s) => s.eaten("bird")], ...warnings(0.5, 7.9, (t) => (t < 4 || t >= 5.3 ? [] : [Object.assign(k, { level: t < 4.8 ? 0.8 : 1, coiled: t >= 4.8, coil: 5.3 - t, pan: 0.2 })]))],
        // (The loudest 30 ms against the band's level before.)
        // (The loudest 30 ms from just after the coil's last tick, which ends at 5.3, against
        // the loudest before it all.)
        measure: (m) => ({ early: m.bandMax(5.33, 5.64, 2500, 3500, 0.03) - m.bandMax(2.5, 3.9, 2500, 3500, 0.03), clack: m.bandMax(5.66, 5.76, 2500, 3500, 0.03) - m.bandMax(2.5, 3.9, 2500, 3500, 0.03) }),
      };
    })(),
    // A heron's strike that bites (a big fish): the bite at 6.3, the heron in its strike till
    // 7.2 -- no snap or croak after the bite.
    (() => {
      const he = hunter("heron");
      return {
        name: "heron_bite",
        kind: "shot",
        seconds: 10,
        params: { regions: only("upper"), flow: 2 },
        events: [[6.3, (s) => s.thump("body", 1.3)], ...warnings(0.5, 9.9, (t) => (t < 4 || t >= 7.2 ? [] : [Object.assign(he, { level: t < 5 ? 0.5 : t < 6 ? 0.8 : 1, coiled: t >= 6, coil: 6.3 - t, pan: -0.4 })]))],
        measure: (m) => ({ snaps: m.onsets(6.45, 9.5, 2000, 3200, 8), croak: m.band(6.5, 9.5, 700, 1200) - m.band(2, 3.9, 700, 1200) }),
      };
    })(),
    // The last tick of a coil where its strike comes: a bullhead's short one, a king's long.
    coiling("coil_short", 0.18),
    coiling("coil_long", 0.45),
    // A drive of three goosanders noticing the fish at once: one call, not three.
    (() => {
      const drive = [hunter("drive", 1), hunter("drive", 2), hunter("drive", 3)];
      return { name: "drive_notice", kind: "shot", params: {}, events: warnings(0.5, 7.9, (t) => (t < 4 ? [] : drive.map((d, i) => Object.assign(d, { level: 0.4, pan: i - 1, near: 0.6 })))) };
    })(),
    // A pike lying in wait with the fish in view for a minute: its pulses thin out.
    (() => {
      const h = hunter("pike", 7);
      // (Counted as played: three nodes each, placed.)
      return { name: "stalk_60s", kind: "shot", seconds: 64, params: {}, events: warnings(0.5, 63.9, (t) => (t < 4 ? [] : [Object.assign(h, { level: 0.6, near: 0.4, pan: 0.3 })])), measure: (m) => ({ first: m.eventNodes(4.5, 12.5) / 3, last: m.eventNodes(43.5, 63.5) / 3, level: m.loud(58, 63.5) - m.loud(2, 3.9) }) };
    })(),
    // A rival courting the hen at the redd: noticed, but no pulses.
    (() => {
      const rv = hunter("rival", 9);
      return { name: "redd_rival", kind: "shot", seconds: 20, params: {}, events: warnings(0.5, 19.9, (t) => (t < 4 ? [] : [Object.assign(rv, { level: 0.9, near: 0.7, pan: 0.2 })])), measure: (m) => ({ pulses: m.eventNodes(5, 19.5) / 3 }) };
    })(),
    // Started at once, before its samples are made: it plays what is there, the rest when
    // it is made (every sound asked for from 1 s on, and again at 4 s).
    { name: "early_start", kind: "shot", early: true, params: busy, events: [[1, (s) => everything(s)], [4, (s) => everything(s)]], measure: (m) => ({ making: m.makingAtStart }) },
    // Strength low from 4 s on, for good (a blow at 30 s takes more of it): the heart for ten
    // seconds, then not again until the blow.
    {

  async function render(scene) {
    seconds = scene.seconds ?? 8;
    try {
      localStorage.removeItem("habitat-sound");
    } catch {}
    const sound = createSound();
    // As in the game: the sound object exists a while (the loading) before the first click,
    // time for it to make its samples (up to 3 s here; the game loads for longer) -- or,
    // `early`, a click at once.
    for (let i = 0; i < 30 && !scene.early && (i < 3 || sound.stats?.making); i++) await new Promise((resolve) => setTimeout(resolve, 100));
    const madeMs = sound.stats?.madeMs;
    const t0 = performance.now();
    sound.start();
    const startMs = performance.now() - t0;
    const makingAtStart = sound.stats?.making;
    const ctx = current;
    const baseNodes = ctx.count;
    const params = (t) => {
      const p = { ...bed, ...(typeof scene.params === "function" ? scene.params(t) : scene.params) };
      // (For the sound as it was, which only knew above or not.)
      p.above = p.submerged < 0.5;
      return p;
    };
    const dt = 1 / 30;
    const events = [...(scene.events ?? [])].sort((a, b) => a[0] - b[0]);
    let shotNodes = 0;
    let bubbleNodes = 0;
    let maxLive = 0;
    let updateMs = 0;
    const watched = [],
      eventNodes = [];
    sound.update(dt, params(0));
    for (let i = 1; i < seconds / dt - 1; i++) {
      const t = i * dt;
      OfflineAudioContext.prototype.suspend.call(ctx, t).then(() => {
        if (i === 3 && (scene.kind === "solo" || scene.alone)) for (const s of ctx.sources) if (s.loop) s.stop();
        const made = ctx.count;
        while (events.length && events[0][0] <= t + 1e-6) {
          const before = ctx.count;
          events.shift()[1](sound, t);
          shotNodes += ctx.count - before;
        }
        if (ctx.count > made) eventNodes.push([t, ctx.count - made]);
        const before = ctx.count;
        const p = params(t);
        const u0 = performance.now();
        sound.update(dt, p);
        updateMs += performance.now() - u0;
        bubbleNodes += ctx.count - before;
        maxLive = Math.max(maxLive, sound.stats?.live ?? 0);
        if (scene.watch) watched.push([t, scene.watch(sound)]);
        ctx.resume();
      });
    }

    // that came a moment too soon, and the render never ends: nudged again if nothing has
    // moved for two seconds.)
    let moved = performance.now(),
      at = -1;
    const nudge = setInterval(() => {
      if (ctx.currentTime !== at) (at = ctx.currentTime), (moved = performance.now());
      else if (performance.now() - moved > 2000) {
        moved = performance.now();
        ctx.resume().catch(() => {});
      }
    }, 500);
    const buffer = await ctx.startRendering();
    clearInterval(nudge);
    const stats = sound.stats ?? {};
    return { buffer, startMs, madeMs, baseNodes, shotNodes, bubbleNodes, maxLive, nodes: ctx.count, bytes: stats.bytes, unbanked: stats.unbanked, updateUs: (updateMs * 1000) / (seconds / dt), live: stats.live, watched, eventNodes, makingAtStart };
  }

  // ---- Measuring.
  function biquad(x, b, a) {
    const y = new Float32Array(x.length);

      x2 = 0,
      y1 = 0,
      y2 = 0;
    for (let i = 0; i < x.length; i++) {
      const v = b[0] * x[i] + b[1] * x1 + b[2] * x2 - a[1] * y1 - a[2] * y2;
      x2 = x1;
      x1 = x[i];
      y2 = y1;
      y1 = v;
      y[i] = v;
    }

  const kweight = (x) => biquad(biquad(x, [1.53512485958697, -2.69169618940638, 1.19839281085285], [1, -1.69065929318241, 0.73248077421585]), [1, -2, 1], [1, -1.99004745483398, 0.99007225036621]);

  function highpass(x, f, q) {

      cos = Math.cos(w),
      alpha = Math.sin(w) / (2 * q),
      a0 = 1 + alpha;
    return biquad(x, [(1 + cos) / 2 / a0, -(1 + cos) / a0, (1 + cos) / 2 / a0], [1, (-2 * cos) / a0, (1 - alpha) / a0]);

  const db = (ms) => -0.691 + 10 * Math.log10(ms + 1e-20);
  // Loudness of [from, to) seconds, both channels K-weighted already.
  function meanSquare(ks, from, to) {

  // Spectral centroid and share of energy per band over [from, to), both channels summed.
  function spectrum(channels, from, to) {
    const a = Math.floor(from * SR),
      n0 = Math.floor((to - from) * SR);
    let n = 1;
    while (n < n0) n <<= 1;
    const re = new Float64Array(n),
      im = new Float64Array(n);
    for (let i = 0; i < n0; i++) re[i] = ((channels[0][a + i] + channels[1][a + i]) / 2) * (0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (n0 - 1)));

        wi = Math.sin(ang);

            ui = im[i + k];

          im[i + k] = ui + vi;
          re[i + k + len / 2] = ur - vr;

  // onsets in it (pulses, ticks), left against right.
  function toolbox(channels, k, kp, r) {
    const cache = new Map();
    const banded = (f0, f1) => {

      loud: (from, to) => loud(k, from, to),
      loudPhone: (from, to) => loud(kp, from, to),
      loudest: (from, to, window) => loudest(k, from, to, window),
      loudestPhone: (from, to, window) => loudest(kp, from, to, window),
      band: (from, to, f0, f1) => plainDb(meanSquare(banded(f0, f1), from, to)),

      // How much a band swells and falls (standard deviation of its loudness in dB).

      // The period (s) at which the band's loudness repeats best, between two lags.
      period(from, to, f0, f1, minLag, maxLag, window = 0.25) {

          bestLag = 0;

      // Onsets: the band's loudness (20 ms windows) rising by `rise` dB over its low of the
      // 60 ms before, at least `spacing` s apart.
      onsets(from, to, f0, f1, rise = 6, spacing = 0.04) {

          last = -1e9;
        for (let i = 12; i < s.length - 1; i++) {
          let low = Infinity;
          for (let j = i - 12; j < i - 2; j++) low = Math.min(low, s[j]);
          if (s[i] - low >= rise && s[i] >= s[i - 1] && s[i] >= s[i + 1] && (i - last) * hop >= spacing) {

            last = i;
          }
        }

      },
      // Left over right (dB) in [from, to), in the band f0-f1 (bed and all: taking the bed
      // off breaks down where a channel has nothing over it).
      pan(from, to, f0, f1) {

  function measure(scene, r) {

    out.peak = +(20 * Math.log10(peak + 1e-20)).toFixed(1);

      out.phone = r1(loud(kp, 3, seconds));
      Object.assign(out, spectrum(channels, 3, seconds));
    } else if (scene.kind === "silent") {
      out.full = r1(loud(k, 3, seconds));

      for (const [name, ks] of [
        ["", k],
        ["Phone", kp],

        const under = mean(series(ks, 2, 4, 0.4));
        out["under" + name] = r1(under);
        out["above" + name] = r1(mean(series(ks, scene.name === "leap_whole" ? 4.3 : 4.6, scene.name === "leap_whole" ? 5 : 6, 0.4)));
        out["jump" + name] = r1(loudest(ks, 3.8, 7.4, 0.4) - under);
        out["jump100" + name] = r1(loudest(ks, 3.8, 7.4, 0.1) - loudest(ks, 2, 4, 0.1));
      }

      const at = scene.at ?? 4,

      out.bedFull = r1(loud(k, 2.5, 4));
      out.dFull = r1(loudest(k, at, until, 0.05) - loudest(k, 2.5, 4, 0.05));
      out.dPhone = r1(loudest(kp, at, until, 0.05) - loudest(kp, 2.5, 4, 0.05));
      out.d400 = r1(loudest(k, at, until, 0.4) - loudest(k, 2.5, 4, 0.4));

    if (scene.measure) {
      const extra = scene.measure(toolbox(channels, k, kp, r));
      for (const [key, v] of Object.entries(extra)) extra[key] = typeof v === "number" ? +v.toFixed(2) : v;
      out.extra = extra;
    }

    if (out.bands) out.bands = out.bands.map(r1);

    let s = "";
    const bytes = new Uint8Array(view.buffer);
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }

  window.scenes = () => SCENES.map((s) => s.name);
  window.runScene = async (name, withWav = false) => {
    const scene = SCENES.find((s) => s.name === name);
    const r = await render(scene);
    const out = measure(scene, r);
    // (Kept here and fetched a slice at a time: a long scene's .wav is too big for one
    // message back.)
    if (withWav) window.lastWav = wav(r.buffer);
    return out;
  };
  window.runAll = async () => {
    const out = [];
    for (const s of SCENES) out.push(await window.runScene(s.name));
    return out;
  };
  window.ready = true;
</script>
